<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith OX — AI Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="ox-landing">

    <!-- Minimal header: brand + sign in only -->
    <header class="ox-landing-header">
        <a href="/" class="ox-landing-brand">
            <img src="{{ url_for('static', filename='images/logo-orb.png') }}"
                 alt="Zenith OX"
                 onerror="this.style.fontSize='28px';this.outerHTML='<span style=\'font-size:28px;filter:drop-shadow(0 0 8px rgba(201,168,76,0.5))\'>🐂</span>'">
            <span class="ox-landing-brand__name">ZENITH OX</span>
        </a>
        <a href="{{ url_for('auth.login_page') }}" class="ox-btn-hero-ghost" style="padding:10px 22px;font-size:14px;">Sign in</a>
    </header>

    <!-- Hero: perfectly centered, minimal text, two CTAs -->
    <main class="ox-landing-hero">
        <h1>The Workflow with <span>multiple minds</span></h1>
        <p>One workspace. Many AI minds. Built for deep work.</p>
        <div class="ox-landing-cta">
            <a href="{{ url_for('auth.register') }}" class="ox-btn-hero-primary">Try Now</a>
            <a href="{{ url_for('auth.login_page') }}" class="ox-btn-hero-ghost">Sign In</a>
        </div>
    </main>

    <!-- Toast container (for any flash messages) -->
    <div id="toastContainer" aria-live="polite"></div>

    <footer class="ox-landing-footer">
        <span>Zenith OX v2.8</span>
    </footer>

</body>
</html>
