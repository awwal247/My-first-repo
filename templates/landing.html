<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith OX — AI Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="landing-page landing-page--minimal">

    <!-- Minimal header: brand + sign in only -->
    <header class="site-header site-header--minimal">
        <div class="site-header__inner">
            <a href="/" class="brand-mark">
                <span class="brand-mark__orb"></span>
                <span><strong>Zenith OX</strong></span>
            </a>
            <a href="{{ url_for('auth.login_page') }}" class="btn-ghost">Sign in</a>
        </div>
    </header>

    <!-- Hero: perfectly centered, minimal text, two CTAs -->
    <main class="landing-hero-center">
        <div class="landing-hero-center__inner">
            <h1 class="landing-hero-title">The Workflow with multiple mind</h1>
            <p class="landing-hero-sub">One workspace. Many AI minds. Built for deep work.</p>
            <div class="landing-hero-cta">
                <a href="{{ url_for('auth.register') }}" class="btn-primary btn-primary--xl">Try Now</a>
                <a href="{{ url_for('auth.login_page') }}" class="btn-ghost btn-ghost--xl">Sign In</a>
            </div>
        </div>
    </main>

    <!-- Toast container (for any flash messages) -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <footer class="landing-footer landing-footer--minimal">
        <span>Zenith OX v2.7</span>
    </footer>

</body>
</html>
