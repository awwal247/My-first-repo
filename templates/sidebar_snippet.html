<!-- Sidebar snippet for chat history items -->
{% macro chat_item(chat) %}
<div class="zh-chat-item {% if chat.pinned %}pinned{% endif %}" data-id="{{ chat.id }}">
    <span class="zh-chat-icon">{{ chat.emoji or '💬' }}</span>
    <div class="zh-chat-body">
        <div class="zh-chat-title">{{ chat.title }}</div>
        <div class="zh-chat-meta">{{ chat.mode }} • {{ chat.message_count }} messages</div>
    </div>
    <button class="zh-pin-btn {% if chat.pinned %}pinned{% endif %}" title="Pin">📌</button>
    <button class="zh-rename-btn" title="Rename">✏️</button>
    <button class="zh-delete-btn" title="Delete">🗑️</button>
</div>
{% endmacro %}
