<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith OX — Choose Your AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="menu-container">
        <header class="menu-header">
            <h1>{{ greeting }} 👋</h1>
            <p class="username">👤 {{ username }} <a href="/logout">⎋ Logout</a></p>
        </header>
        <main class="menu-grid">
            <h2>Choose Your AI Assistant</h2>
            <p class="subtitle">Each mode is tuned for a specific task</p>
            <div class="modes-grid">
                {% for key, mode in modes.items() %}
                <a href="/select-mode/{{ key }}" class="mode-card">
                    <span class="mode-emoji">{{ mode.emoji }}</span>
                    <h3>{{ mode.name }}</h3>
                    <p>{{ mode.tagline }}</p>
                </a>
                {% endfor %}
            </div>
        </main>
    </div>
</body>
</html>
