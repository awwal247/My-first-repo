<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zenith OX — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to Zenith OX — your intelligent AI research assistant." />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml" />
</head>
<body class="auth-body">

  <div class="glass-card auth-card">
    <h1>ZENITH <span class="accent">OX</span></h1>
    <p class="tagline">Sign in to your account</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="flash flash-{{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form class="auth-form" method="POST" action="{{ url_for('auth.login_page') }}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required
             placeholder="you@example.com" autocomplete="email" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required
             placeholder="Your password" autocomplete="current-password" />

      <button type="submit">Sign in</button>
    </form>

    {% if google_enabled() %}
      <div class="divider"><span>or</span></div>
      <a class="google-btn" href="{{ url_for('auth.login_google') }}">
        <span class="g-icon">G</span> Continue with Google
      </a>
    {% endif %}

    <p class="foot">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
    </p>
  </div>

</body>
</html>
